name: Terraform Architecture Diagram (Azure + Floci)

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tfvars"
      - ".github/workflows/architecture.yaml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Select the environment:"
        type: choice
        required: true
        default: "Dev"
        options:
          - Dev
          - Staging
          - Production

permissions:
  contents: read

jobs:
  diagram:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ github.event_name == 'workflow_dispatch' && fromJson(format('["{0}"]', inputs.environment)) || fromJson('["dev","staging","prod"]') }}

    env:
      TF_VAR_metadata_host: "127.0.0.1:4577"
      TF_VAR_subscription_id: ${{ secrets.TF_VAR_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.TF_VAR_TENANT_ID }}
      TF_VAR_client_id: ${{ secrets.TF_VAR_CLIENT_ID }}
      TF_VAR_client_secret: ${{ secrets.TF_VAR_CLIENT_SECRET }}
#      ARM_SKIP_PROVIDER_REGISTRATION: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install Floci CLI and Graphviz
        run: |
          curl -fsSL https://floci.io/install.sh | sh
          sudo apt-get update && sudo apt-get install -y graphviz

      - name: Start Azure Floci Emulator
        run: |
          floci az start
          sleep 2
          echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
          curl -sf http://127.0.0.1:4577/_floci/tls-cert -o /tmp/floci-az.crt
          sudo cp /tmp/floci-az.crt /usr/local/share/ca-certificates/floci-az.crt
          sudo update-ca-certificates

      - name: Remove HCP Terraform Cloud Block for Local Execution
        run: |
          python3 - << 'EOF'
          import pathlib, re
          for tf_file in pathlib.Path(".").rglob("*.tf"):
              text = tf_file.read_text(encoding="utf-8")
              cleaned = re.sub(r'cloud\s*\{(?:[^{}]|\{[^{}]*\})*\}', '', text, flags=re.DOTALL)
              if cleaned != text:
                  tf_file.write_text(cleaned, encoding="utf-8")
          EOF

      - name: Terraform Init (Local State + Floci)
        run: terraform init -input=false

      - name: Select Environment Workspace (${{ matrix.environment }})
        run: terraform workspace select ${{ matrix.environment }} || terraform workspace new ${{ matrix.environment }}

      - name: Run Terraform Plan to Output File (${{ matrix.environment }})
        run: |
          PLAN_BIN="tfplan-${{ matrix.environment }}.binary"
          PLAN_JSON="tfplan-${{ matrix.environment }}.json"
          GRAPH_DOT="graph-${{ matrix.environment }}.dot"

          terraform plan -input=false -out="$PLAN_BIN"
          terraform show -json "$PLAN_BIN" > "$PLAN_JSON"
          terraform graph -type=plan > "$GRAPH_DOT"

      - name: Render Architecture Diagram (${{ matrix.environment }})
        run: |
          test -s "tfplan-${{ matrix.environment }}.json"
          dot -Tpng "graph-${{ matrix.environment }}.dot" -o "architecture-${{ matrix.environment }}.png"
          dot -Tsvg "graph-${{ matrix.environment }}.dot" -o "architecture-${{ matrix.environment }}.svg"

      - name: Upload Diagram Artifact (${{ matrix.environment }})
        id: upload_diagram
        uses: actions/upload-artifact@v4
        with:
          name: terraform-architecture-diagram-${{ matrix.environment }}
          path: |
            architecture-${{ matrix.environment }}.png
            architecture-${{ matrix.environment }}.svg

      - name: Output Downloadable Diagram Link (${{ matrix.environment }})
        run: |
          echo "[${{ matrix.environment }}] Download diagram artifact: ${{ steps.upload_diagram.outputs.artifact-url }}"
          {
            echo "### Environment: \`${{ matrix.environment }}\`"
            echo "- [Download terraform-architecture-diagram-${{ matrix.environment }} ZIP](${{ steps.upload_diagram.outputs.artifact-url }})"
          } >> $GITHUB_STEP_SUMMARY